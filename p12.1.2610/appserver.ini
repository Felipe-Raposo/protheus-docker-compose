[P12]
SourcePath=/protheus12/apo
RPOCustom=/protheus12/apo/custom.rpo
RootPath=/protheus12/protheus_data
StartPath=/system/
RpoDb=top
RpoLanguage=Multi
RpoVersion=120
LocalFiles=SQLite
StartSysInDb=1
TopMemoMega=50

; AppServer 26.3.0.0 (build 7.00.260324P) encerra o processo quando o
; multiprotocolo nao consegue publicar /app-root (erro -107, thread pool
; MAIN|SD|HTTP sem Slaves). Sem MPP, o WebApp escuta na 1234 e o
; SmartClient TCP fica na 1235.
[Drivers]
Active=TCP
MultiProtocolPort=1
MultiProtocolPortSecure=0

[TCP]
TYPE=TCPIP
Port=1235

[LicenseClient]
Server=license-server
Port=5555

[General]
app_environment=P12
ShowFullLog=0
MaxStringSize=500
MaxQuerySize=31960
PowerSchemeShowUpgradeSuggestion=0
ConsoleLog=1
AsyncConsoleLog=1
BuildKillUsers=1

[DBAccess]
Server=dbaccess
Port=7890
ConType=TCPIP
Database=POSTGRES
Alias=protheus

[WebApp]
Port=1234
LastMainProg=sigaadv,sigacfg,apsdu
EnvServer=P12

[WebApp/webapp]
MPP=

[WEBAGENT]
VERSION=1.1.2
Windows_x64=../webagent/web-agent-1.1.2-windows-x64-release.setup.exe
Linux_x64_deb=../webagent/web-agent-1.1.2-linux-x64-release.deb
Linux_x64_rpm=../webagent/web-agent-1.1.2-linux-x64-release.rpm
Darwin_universal=../webagent/web-agent-1.1.2-macos-universal-release.dmg

[HTTPServer]
ENABLE=0

[HUB]
ENABLE=0

[WebMonitor]
Enable=1

[APP_MONITOR]
enable=1

[TDS]
AllowApplyPatch=*
AllowEdit=*
EnableDisconnectUser=*
EnableSendMessage=*
EnableBlockNewConnection=*
EnableStopServer=*
